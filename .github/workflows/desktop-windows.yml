name: برنامج الديسكتوب (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-app/**'
      - 'revenue-team/building.html'
      - '.github/workflows/desktop-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: محرك Python (exe)
        run: |
          python -m pip install openpyxl==3.1.5 pyinstaller==6.11.1
          pyinstaller --onefile --name revenue_engine --distpath engine/dist --workpath engine/build --specpath engine engine/revenue_engine.py
      - name: اختبار المحرك على بيانات وهمية
        run: |
          python samples/make_sample_data.py
          npm ci
          npm test
      - name: بناء المثبّت
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: RevenueTeam-Setup
          path: desktop-app/dist/*.exe
          retention-days: 30
